<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vigilance - Analytics</title>
    <link rel="stylesheet" href="/static/shared.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>(function(){ const theme = localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme', theme); })();</script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; transition: background 0.3s, color 0.3s; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { padding: 20px 32px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); z-index: 10; }
        .toolbar-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
        .toolbar-actions { display: flex; gap: 12px; align-items: center; }
        .content { flex: 1; padding: 32px; overflow-y: auto; background: var(--bg-secondary); }
        .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border-color); background: var(--bg-panel); color: var(--text-primary); font-size: 0.85rem; }
        .btn:hover { background: var(--bg-secondary); }
        .btn.active { background: var(--accent); color: white; border-color: var(--accent); }
        .camera-filter { padding: 10px 16px; border-radius: 8px; background: var(--bg-panel); color: var(--text-primary); border: 1px solid var(--border-color); font-size: 0.85rem; outline: none; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-bottom: 32px; }
        .stat-card { background: var(--bg-panel); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); box-shadow: var(--shadow); transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-4px); }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; font-weight: 700; color: var(--text-secondary); letter-spacing: 1px; margin-bottom: 12px; }
        .stat-value { font-size: 2rem; font-weight: 800; color: var(--text-primary); line-height: 1; }
        .stat-change { margin-top: 8px; font-size: 0.8rem; font-weight: 600; }
        .stat-change.up { color: #27ae60; }
        .stat-change.down { color: var(--accent); }
        .charts-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
        .chart-card { background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border-color); padding: 24px; box-shadow: var(--shadow); }
        .chart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .chart-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
        .chart-container { position: relative; height: 350px; }
    </style>
</head>
<body>
    <div class="app-container">
        {% include '_sidebar.html' %}

        <div class="toast-container" id="toast-container"></div>

        <div class="main-content">
            <div class="toolbar">
                <h1 class="toolbar-title">Operations Dashboard</h1>
                <div class="toolbar-actions">
                    <div id="live-clock" style="margin-right: 20px; font-weight: 700; color: var(--text-secondary); font-family: monospace;"></div>
                    <select id="camera-filter" class="camera-filter" onchange="loadAnalytics()"><option value="">All Camera Feeds</option></select>
                    <div style="display: flex; gap: 8px; background: var(--bg-secondary); padding: 4px; border-radius: 10px;">
                        <button class="btn active" onclick="setTimeRange('24h')">Last 24h</button>
                        <button class="btn" onclick="setTimeRange('7d')">7 Day Report</button>
                    </div>
                </div>
            </div>
            <div class="content">
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label" id="lbl-total-detections">Total Detections</div><div class="stat-value" id="total-detections"><div class="bone bone-rounded" style="height:38px;width:70%;display:inline-block;"></div></div><div class="stat-change" id="detection-change"><div class="bone bone-square" style="height:12px;width:55%;display:inline-block;"></div></div></div>
                    <div class="stat-card"><div class="stat-label">Peak Hour</div><div class="stat-value" id="peak-hour"><div class="bone bone-rounded" style="height:38px;width:60%;display:inline-block;"></div></div><div class="stat-change" id="peak-count"><div class="bone bone-square" style="height:12px;width:65%;display:inline-block;"></div></div></div>
                    <div class="stat-card"><div class="stat-label">Avg Per Hour</div><div class="stat-value" id="avg-hour"><div class="bone bone-rounded" style="height:38px;width:50%;display:inline-block;"></div></div><div class="stat-change"><div class="bone bone-square" style="height:12px;width:40%;display:inline-block;"></div></div></div>
                    <div class="stat-card"><div class="stat-label">Active Cameras</div><div class="stat-value" id="active-cameras"><div class="bone bone-rounded" style="height:38px;width:45%;display:inline-block;"></div></div><div class="stat-change"><div class="bone bone-square" style="height:12px;width:50%;display:inline-block;"></div></div></div>
                </div>
                <div class="charts-grid">
                    <div class="chart-card"><div class="chart-header"><span class="chart-title">Hourly Traffic Pattern</span></div><div class="chart-container" id="hourly-chart-wrap"><div id="hourly-skeleton" class="bone bone-chart" style="position:absolute;inset:0;height:100%;border-radius:8px;"></div><canvas id="hourlyChart" style="opacity:0;transition:opacity 0.4s;"></canvas></div></div>
                    <div class="chart-card"><div class="chart-header"><span class="chart-title">Daily Trend (Last 7 Days)</span></div><div class="chart-container" id="daily-chart-wrap"><div id="daily-skeleton" class="bone bone-chart" style="position:absolute;inset:0;height:100%;border-radius:8px;"></div><canvas id="dailyChart" style="opacity:0;transition:opacity 0.4s;"></canvas></div></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/skeleton.js"></script>
    <script src="/static/shared.js"></script>
    <script>
        let hourlyChart = null, dailyChart = null, currentRange = '24h';

        async function loadCameras() {
            try {
                const res = await fetch('/api/cameras');
                const cameras = await res.json();
                const select = document.getElementById('camera-filter');
                cameras.forEach(cam => { const opt = document.createElement('option'); opt.value = cam.id; opt.textContent = cam.id; select.appendChild(opt); });
            } catch (err) {}
        }

        function setTimeRange(range) {
            currentRange = range;
            document.querySelectorAll('.toolbar-actions .btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            loadAnalytics();
        }

        async function loadAnalytics() {
            const cameraId = document.getElementById('camera-filter').value;
            try {
                const hourlyRes = await fetch(`/api/analytics/hourly?camera_id=${cameraId}`);
                const hourlyData = await hourlyRes.json();
                const dailyRes = await fetch(`/api/analytics/daily?camera_id=${cameraId}&days=7`);
                const dailyData = await dailyRes.json();
                updateStats(hourlyData, dailyData);
                renderCharts(hourlyData, dailyData);
                Boneyard.hide('hourly-skeleton'); Boneyard.hide('daily-skeleton');
                document.getElementById('hourlyChart').style.opacity = '1';
                document.getElementById('dailyChart').style.opacity = '1';
            } catch (err) {}
        }

        function updateStats(hourlyData, dailyData) {
            const maxPeak = Math.max(...hourlyData.map(d => d.count), 0);
            document.getElementById('total-detections').textContent = maxPeak;
            document.querySelector('#total-detections').previousElementSibling.textContent = 'Peak Hits Today';
            const peak = hourlyData.reduce((max, d) => d.count > max.count ? d : max, hourlyData[0] || {label: '-', count: 0});
            document.getElementById('peak-hour').textContent = peak.label;
            document.getElementById('peak-count').textContent = `+${peak.count} Event Peak`;
            const avg = hourlyData.length > 0 ? (hourlyData.reduce((s, d) => s + d.count, 0) / hourlyData.length).toFixed(1) : 0;
            document.getElementById('avg-hour').textContent = avg;
            const activeCams = new Set(hourlyData.filter(d => d.camera_id).map(d => d.camera_id)).size;
            document.getElementById('active-cameras').textContent = activeCams || '0';
        }

        function getChartColors() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            return { grid: isDark ? '#333333' : '#e0e0e0', text: isDark ? '#aaaaaa' : '#666666' };
        }

        function renderCharts(hourlyData, dailyData) {
            const colors = getChartColors();
            Chart.defaults.color = colors.text; Chart.defaults.borderColor = colors.grid;
            if (hourlyChart) hourlyChart.destroy();
            hourlyChart = new Chart(document.getElementById('hourlyChart').getContext('2d'), { type: 'bar', data: { labels: hourlyData.map(d => d.label), datasets: [{ label: 'Internal Flow', data: hourlyData.map(d => d.count), backgroundColor: '#c41e3a', borderRadius: 6 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: colors.grid }, ticks: { color: colors.text } }, x: { grid: { display: false }, ticks: { color: colors.text } } } } });
            if (dailyChart) dailyChart.destroy();
            dailyChart = new Chart(document.getElementById('dailyChart').getContext('2d'), { type: 'line', data: { labels: dailyData.map(d => d.date), datasets: [{ label: 'Weekly Intelligence', data: dailyData.map(d => d.count), borderColor: '#c41e3a', backgroundColor: 'rgba(196, 30, 58, 0.1)', borderWidth: 4, fill: true, tension: 0.4, pointRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { y: { grid: { color: colors.grid }, ticks: { color: colors.text } }, x: { grid: { display: false }, ticks: { color: colors.text } } } } });
        }

        function updateChartColors() { if (hourlyChart || dailyChart) loadAnalytics(); }

        // Override toggleTheme to also update charts
        const _origToggle = window.toggleTheme;
        window.toggleTheme = function() { if(_origToggle) _origToggle(); updateChartColors(); };

        document.addEventListener('DOMContentLoaded', () => { loadCameras(); loadAnalytics(); });
        setInterval(loadAnalytics, 300000);
    </script>
</body>
</html>
