<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vigilance - Recordings</title>
    <link rel="stylesheet" href="/static/shared.css">
    <script>(function(){ const theme = localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme', theme); })();</script>
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { background: var(--bg-panel); padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; transition: background 0.3s; }
        .toolbar-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .content { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg-secondary); transition: background 0.3s; }
        .filter-bar { background: var(--bg-panel); padding: 15px 20px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow); transition: background 0.3s, border-color 0.3s; }
        .filter-group { display: flex; align-items: center; gap: 8px; }
        .filter-group label { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
        .filter-group input, .filter-group select { padding: 8px 12px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; border-radius: 4px; }
        .btn { padding: 8px 20px; border: 1px solid var(--border-color); background: var(--bg-panel); color: var(--text-primary); font-size: 13px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .btn:hover { background: var(--bg-secondary); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .data-table { width: 100%; border-collapse: collapse; background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; box-shadow: var(--shadow); transition: background 0.3s, border-color 0.3s; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .data-table th { background: var(--accent); color: #fff; font-weight: 600; font-size: 13px; }
        .data-table td { font-size: 13px; color: var(--text-primary); }
        .data-table tr:hover { background: var(--bg-secondary); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-panel); width: 85%; max-width: 1100px; border-radius: 12px; overflow: hidden; box-shadow: 0 40px 100px rgba(0,0,0,0.6); border: 1px solid var(--border-color); }
        .modal-header { background: var(--accent); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }
        .modal-title { color: #fff; font-size: 16px; font-weight: 700; }
        .modal-close { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; }
        .modal-body { padding: 0; background: #000; }
        .modal-body video { width: 100%; display: block; border-bottom: 1px solid #333; }
        .security-timeline-wrapper { padding: 20px; background: #252525; border-top: 1px solid #444; user-select: none; }
        .timeline-header { display: flex; justify-content: space-between; color: #888; font-size: 11px; margin-bottom: 8px; font-family: monospace; }
        .scrubber-container { position: relative; width: 100%; height: 14px; background: #333; border-radius: 7px; cursor: pointer; overflow: visible; box-shadow: inset 0 2px 4px rgba(0,0,0,0.3); }
        .timeline-ruler { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; padding: 0 5px; pointer-events: none; }
        .ruler-mark { width: 1px; height: 100%; background: rgba(255,255,255,0.05); }
        .detection-marker { position: absolute; top: -2px; width: 4px; height: 18px; background: #ff4d4d; border-radius: 2px; cursor: pointer; transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); z-index: 10; box-shadow: 0 0 8px rgba(255, 77, 77, 0.4); }
        .detection-marker:hover { transform: scaleY(1.4) scaleX(1.2); background: #ff7675; z-index: 20; box-shadow: 0 0 15px rgba(255, 77, 77, 0.8); }
        .playhead { position: absolute; top: -4px; left: 0; width: 2px; height: 22px; background: #fff; box-shadow: 0 0 10px #fff; pointer-events: none; z-index: 30; transition: left 0.1s linear; }
        .timeline-tooltip { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 5px 10px; border-radius: 4px; font-size: 11px; white-space: nowrap; display: none; pointer-events: none; border: 1px solid #444; }
        .detection-marker:hover .timeline-tooltip { display: block; }
    </style>
</head>
<body>
    <div class="app-container">
        {% include '_sidebar.html' %}

        <div class="main-content">
            <div class="toolbar">
                <h1 class="toolbar-title">Video Recordings</h1>
                <div id="live-clock" style="font-weight: bold; color: #555;"></div>
            </div>
            <div class="content">
                <div class="filter-bar">
                    <div class="filter-group"><label>Camera:</label><select id="filter-camera"><option value="">All Cameras</option></select></div>
                    <div class="filter-group"><label>From:</label><input type="datetime-local" id="filter-start"></div>
                    <div class="filter-group"><label>To:</label><input type="datetime-local" id="filter-end"></div>
                    <button class="btn btn-primary" onclick="loadRecordings()">Search</button>
                </div>
                <table class="data-table">
                    <thead><tr><th>Start Time</th><th>Camera</th><th>Duration</th><th>Actions</th></tr></thead>
                    <tbody id="recordings-list">
                        <tr><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:75%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:60%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:40%;"></div></td><td style="padding:12px 15px;"><div style="display:flex;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                        <tr><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:65%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:55%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:35%;"></div></td><td style="padding:12px 15px;"><div style="display:flex;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                        <tr><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:80%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:50%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:45%;"></div></td><td style="padding:12px 15px;"><div style="display:flex;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                        <tr><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:70%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:65%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:30%;"></div></td><td style="padding:12px 15px;"><div style="display:flex;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                        <tr><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:55%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:70%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:45%;"></div></td><td style="padding:12px 15px;"><div style="display:flex;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                    </tbody>
                </table>
                <div id="rec-pagination" style="display:flex;align-items:center;justify-content:space-between;margin-top:16px;padding:0 4px;"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="videoModal">
        <div class="modal-content">
            <div class="modal-header"><span class="modal-title">Video Playback</span><button class="modal-close" onclick="closeVideo()">&times;</button></div>
            <div class="modal-body">
                <video id="videoPlayer" style="max-height: 70vh;"><source src="" type="video/mp4"></video>
                <div class="security-timeline-wrapper">
                    <div class="timeline-header"><span id="timeline-start-time">Timeline Start</span><span id="timeline-end-time">End</span></div>
                    <div class="scrubber-container" id="scrubber-bar" onclick="scrubVideo(event)">
                        <div class="timeline-ruler" id="timeline-ruler"></div>
                        <div class="playhead" id="playhead"></div>
                    </div>
                    <div id="timeline-status" style="margin-top: 15px; font-size: 12px; color: #888; display: flex; justify-content: space-between; align-items: center;">
                        <span id="status-text">Interactive Timeline Ready - Click for jump</span>
                        <div style="display: flex; gap: 15px;"><span id="detection-count" style="color: #ff4d4d; font-weight: 700;">0 Detections</span><span id="current-playback-time" style="color: #fff; font-family: monospace;">00:00 / 00:00</span></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/skeleton.js"></script>
    <script src="/static/shared.js"></script>
    <script>
        async function loadCameras() {
            try {
                const res = await fetch('/api/cameras');
                const cameras = await res.json();
                const select = document.getElementById('filter-camera');
                cameras.forEach(cam => { const opt = document.createElement('option'); opt.value = opt.textContent = cam.id; select.appendChild(opt); });
            } catch (err) {}
        }

        let _recPage = 1;
        const _recPageSize = 50;

        async function loadRecordings(page = 1) {
            _recPage = page;
            const tbody = document.getElementById('recordings-list');
            Boneyard.tableRows('recordings-list', 4, 5);
            try {
                const params = new URLSearchParams();
                const camera = document.getElementById('filter-camera').value;
                const start = document.getElementById('filter-start').value;
                const end = document.getElementById('filter-end').value;
                if (camera) params.append('camera_id', camera);
                if (start) params.append('start_time', start);
                if (end) params.append('end_time', end);
                params.append('page', page);
                params.append('page_size', _recPageSize);
                const res = await fetch(`/api/recordings?${params}`);
                const result = await res.json();
                const recordings = result.data || result; // handle both old array and new {data,total}
                const total = result.total || recordings.length;
                if (recordings.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-secondary);">No recordings match current filters.</td></tr>';
                    document.getElementById('rec-pagination').innerHTML = '';
                    return;
                }
                tbody.innerHTML = recordings.map(r => {
                    const startTime = r.start_time || new Date(r.start_time_iso).toLocaleString('en-IN', {hour12:false});
                    let duration = 'Recording...';
                    if (r.end_time_iso) { const s = new Date(r.start_time_iso), e = new Date(r.end_time_iso); duration = Math.round((e-s)/60000) + ' min'; }
                    const badge = r.has_registered_person ? '<span class="status-badge">Registered Person</span>' : '';
                    const recordingData = encodeURIComponent(JSON.stringify(r));
                    return `<tr class="${r.has_registered_person?'highlight-row':''}"><td style="font-weight:600;">${startTime}${badge}</td><td>${r.camera_id}</td><td>${duration}</td><td><button class="btn btn-primary" onclick='playVideo("${r.file_path}",JSON.parse(decodeURIComponent("${recordingData}")))' style="padding:5px 12px;font-size:12px;">Review</button><button class="btn" onclick="deleteRecording(${r.id})" style="padding:5px 12px;font-size:12px;margin-left:4px;">Delete</button></td></tr>`;
                }).join('');
                // Pagination
                const totalPages = Math.ceil(total / _recPageSize);
                const pg = document.getElementById('rec-pagination');
                if (totalPages <= 1) { pg.innerHTML = `<span style="color:var(--text-secondary);font-size:13px;">${total} recordings</span>`; return; }
                const start2 = (page-1)*_recPageSize+1, end2 = Math.min(page*_recPageSize, total);
                let btns = '';
                for (let i=1;i<=totalPages;i++) {
                    if (i===1||i===totalPages||(i>=page-2&&i<=page+2))
                        btns += `<button onclick="loadRecordings(${i})" style="padding:5px 12px;border-radius:5px;border:1px solid ${i===page?'var(--accent)':'var(--border-color)'};background:${i===page?'var(--accent)':'var(--bg-panel)'};color:${i===page?'#fff':'var(--text-primary)'};cursor:pointer;font-size:12px;">${i}</button>`;
                    else if (i===page-3||i===page+3) btns += `<span style="padding:0 4px;color:var(--text-secondary);">…</span>`;
                }
                pg.innerHTML = `<span style="color:var(--text-secondary);font-size:13px;">Showing ${start2}–${end2} of ${total}</span><div style="display:flex;gap:5px;align-items:center;"><button onclick="loadRecordings(${page-1})" ${page===1?'disabled':''} style="padding:5px 10px;border-radius:5px;border:1px solid var(--border-color);background:var(--bg-panel);color:var(--text-primary);cursor:pointer;">‹</button>${btns}<button onclick="loadRecordings(${page+1})" ${page===totalPages?'disabled':''} style="padding:5px 10px;border-radius:5px;border:1px solid var(--border-color);background:var(--bg-panel);color:var(--text-primary);cursor:pointer;">›</button></div>`;
            } catch(err) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--text-secondary);">Error loading database.</td></tr>'; }
        }

        let currentRecording = null;
        function playVideo(path, recordingData) {
            const player = document.getElementById('videoPlayer');
            player.src = `/api/recording_video?path=${encodeURIComponent(path)}`;
            currentRecording = recordingData;
            document.getElementById('videoModal').classList.add('active');
            document.getElementById('timeline-start-time').textContent = new Date(recordingData.start_time).toLocaleTimeString();
            document.getElementById('timeline-end-time').textContent = recordingData.end_time ? new Date(recordingData.end_time).toLocaleTimeString() : 'Live';
            player.play();
            player.onloadedmetadata = () => setupTimelineMarkers(recordingData.id);
            player.ontimeupdate = updatePlaybackState;
        }

        function formatSeconds(sec) { const m = Math.floor(sec / 60), s = Math.floor(sec % 60); return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; }

        function updatePlaybackState() {
            const player = document.getElementById('videoPlayer');
            if (player.duration) {
                document.getElementById('playhead').style.left = `${(player.currentTime / player.duration) * 100}%`;
                document.getElementById('current-playback-time').textContent = `${formatSeconds(player.currentTime)} / ${formatSeconds(player.duration)}`;
            }
        }

        async function setupTimelineMarkers(recordId) {
            const scrubber = document.getElementById('scrubber-bar');
            const ruler = document.getElementById('timeline-ruler');
            Array.from(scrubber.querySelectorAll('.detection-marker, .activity-peak')).forEach(m => m.remove());
            ruler.innerHTML = '';
            for (let i = 0; i <= 20; i++) ruler.appendChild(document.createElement('div')).className = 'ruler-mark';
            try {
                const res = await fetch(`/api/video_timeline/${recordId}`);
                const data = await res.json();
                const events = data.events || [];
                document.getElementById('detection-count').textContent = `${events.length} Events Detected`;
                const player = document.getElementById('videoPlayer');
                const duration = player.duration || 300;
                events.forEach(evt => {
                    const pos = (evt.offset_sec / duration) * 100;
                    const marker = document.createElement('div');
                    marker.className = 'detection-marker';
                    marker.style.left = `${pos}%`;
                    marker.innerHTML = `<div class="timeline-tooltip"><strong>T+ ${formatSeconds(evt.offset_sec)}</strong><br>${evt.person_count} Person(s)</div>`;
                    marker.onclick = (e) => { e.stopPropagation(); player.currentTime = evt.offset_sec; player.play(); };
                    scrubber.appendChild(marker);
                });
            } catch (err) {}
        }

        function scrubVideo(e) { const player = document.getElementById('videoPlayer'); const rect = document.getElementById('scrubber-bar').getBoundingClientRect(); player.currentTime = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)) * player.duration; player.play(); }
        function closeVideo() { const player = document.getElementById('videoPlayer'); player.pause(); player.src = ''; document.getElementById('videoModal').classList.remove('active'); }
        async function deleteRecording(id) { if (confirm('Delete recording from server?')) { const res = await fetch(`/api/recordings/${id}`, { method: 'DELETE' }); if (res.ok) loadRecordings(); } }
        document.getElementById('videoModal').addEventListener('click', (e) => { if (e.target === document.getElementById('videoModal')) closeVideo(); });

        document.addEventListener('DOMContentLoaded', () => { loadCameras(); loadRecordings(); });
    </script>
</body>
</html>
