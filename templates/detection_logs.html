<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vigilance - Detection Logs</title>
    <link rel="stylesheet" href="/static/shared.css">
    <script>(function(){ const theme = localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme', theme); })();</script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; transition: background 0.3s, color 0.3s; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { padding: 20px 32px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); z-index: 10; }
        .toolbar-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
        .content { flex: 1; padding: 32px; overflow-y: auto; background: var(--bg-secondary); }
        .filter-bar { background: var(--bg-panel); padding: 20px 24px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 24px; display: flex; gap: 20px; align-items: flex-end; box-shadow: var(--shadow); }
        .filter-group { display: flex; flex-direction: column; gap: 8px; }
        .filter-group label { font-size: 0.75rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; }
        .filter-group select { padding: 10px 16px; background: var(--bg-secondary); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-primary); font-size: 0.9rem; outline: none; min-width: 200px; }
        .btn-refresh { padding: 10px 24px; background: var(--accent); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn-refresh:hover { background: var(--accent-hover); }
        .logs-table { width: 100%; background: var(--bg-panel); border-radius: 12px; overflow: hidden; border-collapse: separate; border-spacing: 0; box-shadow: var(--shadow); border: 1px solid var(--border-color); }
        .logs-table th { background: var(--table-header, #c41e3a); color: white; padding: 16px 20px; text-align: left; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .logs-table td { padding: 16px 20px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); font-size: 0.9rem; }
        .logs-table tr:last-child td { border-bottom: none; }
        .logs-table tr:hover { background: var(--bg-secondary); }
        .view-btn { width: 36px; height: 36px; background: var(--accent); color: white; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: transform 0.2s, background 0.2s; }
        .view-btn:hover { background: var(--accent-hover); transform: scale(1.1); }
        .view-btn::before { content: "👁"; font-size: 18px; }
        .person-tag { display: inline-block; background: rgba(196, 30, 58, 0.1); color: var(--accent); padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; margin-right: 6px; border: 1px solid rgba(196, 30, 58, 0.2); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--modal-bg, rgba(0,0,0,0.9)); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(8px); }
        .modal.active { display: flex; }
        .modal-main { display: flex; flex-direction: row; background: #111; width: 94vw; max-height: 92vh; border-radius: 16px; overflow: hidden; border: 1px solid #444; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .modal-left { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #000; }
        .modal-image-container { flex: 1; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 0; }
        .modal-image { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; display: block; }
        .modal-info-bar { flex-shrink: 0; background: rgba(0,0,0,0.9); padding: 10px 20px; color: white; font-size: 0.82rem; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #333; }
        .crop-container { width: 150px; flex-shrink: 0; background: #1a1a1a; border-left: 1px solid #333; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 10px; padding: 14px 10px; }
        .crop-title { color: #888; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; text-align: center; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 2px; }
        .crop-item { width: 100%; border-radius: 8px; overflow: hidden; border: 2px solid #333; background: #000; transition: border-color 0.2s; }
        .crop-item:hover { border-color: var(--accent); }
        .crop-item canvas { width: 100%; display: block; }
        .crop-item-label { font-size: 10px; color: #ccc; text-align: center; padding: 3px 4px; background: #111; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .modal-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; font-size: 18px; cursor: pointer; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .modal-close:hover { background: var(--accent); }
    </style>
</head>
<body>
    <div class="app-container">
        {% include '_sidebar.html' %}

        <div class="main-content">
            <div class="toolbar">
                <h1 class="toolbar-title">Historical Detection Logs</h1>
                <div id="live-clock" style="font-weight: 700; color: var(--text-secondary); font-family: monospace;"></div>
            </div>
            <div class="content">
                <div class="filter-bar">
                    <div class="filter-group">
                        <label>Camera</label>
                        <select id="camera-filter"><option value="">All Cameras</option></select>
                    </div>
                    <div class="filter-group">
                        <label>Date From</label>
                        <input type="date" id="date-from" style="padding:10px 12px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:0.9rem;outline:none;">
                    </div>
                    <div class="filter-group">
                        <label>Date To</label>
                        <input type="date" id="date-to" style="padding:10px 12px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:0.9rem;outline:none;">
                    </div>
                    <button class="btn-refresh" onclick="loadLogs(1)">SEARCH</button>
                    <button class="btn-refresh" style="background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-color);" onclick="clearFilters()">CLEAR</button>
                </div>
                <table class="logs-table" id="logsTable">
                    <thead><tr><th>Time</th><th>Camera</th><th>Camera IP</th><th>Persons</th><th>Action</th></tr></thead>
                    <tbody id="logsBody">
                        <tr><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:55%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:65%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:50%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:14px 20px;"><div class="bone bone-btn bone-rounded"></div></td></tr>
                        <tr><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:70%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:55%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:45%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:14px 20px;"><div class="bone bone-btn bone-rounded"></div></td></tr>
                        <tr><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:45%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:75%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:65%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:14px 20px;"><div class="bone bone-btn bone-rounded"></div></td></tr>
                        <tr><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:60%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:80%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-square" style="height:13px;width:40%;"></div></td><td style="padding:14px 20px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:14px 20px;"><div class="bone bone-btn bone-rounded"></div></td></tr>
                    </tbody>
                </table>
                <div id="pagination" style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:0 4px;"></div>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal" id="imageModal" onclick="closeModal()">
        <div class="modal-main" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-left">
                <div class="modal-image-container"><img class="modal-image" id="modalImage" src="" alt="Detection Snapshot"></div>
                <div class="modal-info-bar"><span id="modalInfo"></span><span style="font-weight:700;color:var(--accent);">AI VIGILANCE AUDIT</span></div>
            </div>
            <div class="crop-container" id="cropContainer"></div>
        </div>
    </div>

    <script src="/static/skeleton.js"></script>
    <script src="/static/shared.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const preselectedCamera = urlParams.get('camera_id');
        const PAGE_SIZE = 20;
        let currentPage = 1, totalRecords = 0, camerasList = [];

        async function loadCameras() {
            try {
                const res = await fetch('/api/cameras');
                camerasList = await res.json();
                const select = document.getElementById('camera-filter');
                select.innerHTML = '<option value="">All Cameras</option>' + camerasList.map(cam => `<option value="${cam.id}" ${cam.id === preselectedCamera ? 'selected' : ''}>${cam.id}</option>`).join('');
            } catch (err) {}
        }

        function clearFilters() {
            document.getElementById('camera-filter').value = '';
            document.getElementById('date-from').value = '';
            document.getElementById('date-to').value = '';
            loadLogs(1);
        }

        async function loadLogs(page = 1) {
            currentPage = page;
            const tbody = document.getElementById('logsBody');
            const cameraId = document.getElementById('camera-filter').value;
            const dateFrom = document.getElementById('date-from').value;
            const dateTo   = document.getElementById('date-to').value;
            Boneyard.tableRows('logsBody', 5, 5);
            try {
                let url = `/api/detection_snapshots?page=${page}&page_size=${PAGE_SIZE}`;
                if (cameraId) url += `&camera_id=${encodeURIComponent(cameraId)}`;
                if (dateFrom) url += `&date_from=${dateFrom}`;
                if (dateTo)   url += `&date_to=${dateTo}`;
                const res = await fetch(url);
                const result = await res.json();
                const logs = result.data || [];
                totalRecords = result.total || 0;
                if (logs.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No detection logs found</td></tr>'; renderPagination(0); return; }
                tbody.innerHTML = logs.map(log => {
                    const imageUrl = `/api/snapshot_image?path=${encodeURIComponent(log.snapshot_path)}`;
                    const cam = camerasList.find(c => c.id === log.camera_id) || {id: log.camera_id, source: 'Unknown'};
                    let camIp = cam.source || 'N/A';
                    if (camIp.includes('@')) camIp = camIp.split('@').pop().split(':')[0].split('/')[0];
                    const logData = JSON.stringify(log).replace(/'/g, "\\'");
                    return `<tr><td><div style="font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:2px;">${log.date_key || ''}</div><div style="font-family:monospace;font-weight:600;font-size:0.88rem;">${log.time_only || log.timestamp}</div></td><td>${log.camera_id}</td><td style="color:var(--text-secondary);font-size:0.82rem;">${camIp}</td><td><span class="person-tag">${log.person_count} person${log.person_count !== 1 ? 's' : ''}</span></td><td><button class="view-btn" title="View Snapshot" onclick='openModal(${logData})'></button></td></tr>`;
                }).join('');
                renderPagination(totalRecords);
            } catch (err) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">Failed to load logs</td></tr>'; }
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / PAGE_SIZE);
            const pg = document.getElementById('pagination');
            if (totalPages <= 1) { pg.innerHTML = ''; return; }
            const start = (currentPage - 1) * PAGE_SIZE + 1;
            const end   = Math.min(currentPage * PAGE_SIZE, total);
            const btnStyle = 'padding:7px 14px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-panel);color:var(--text-primary);cursor:pointer;font-size:13px;';
            const activeBtnStyle = 'padding:7px 14px;border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;font-size:13px;font-weight:700;';
            let pages = '';
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) pages += `<button style="${i === currentPage ? activeBtnStyle : btnStyle}" onclick="loadLogs(${i})">${i}</button>`;
                else if (i === currentPage - 3 || i === currentPage + 3) pages += `<span style="padding:0 4px;color:var(--text-secondary);">…</span>`;
            }
            pg.innerHTML = `<span style="color:var(--text-secondary);font-size:13px;">Showing ${start}–${end} of ${total}</span><div style="display:flex;gap:6px;align-items:center;"><button style="${btnStyle}" onclick="loadLogs(${currentPage-1})" ${currentPage===1?'disabled':''}>‹ Prev</button>${pages}<button style="${btnStyle}" onclick="loadLogs(${currentPage+1})" ${currentPage===totalPages?'disabled':''}>Next ›</button></div>`;
        }

        function openModal(log) {
            const imageUrl = `/api/snapshot_image?path=${encodeURIComponent(log.snapshot_path)}`;
            document.getElementById('modalImage').src = imageUrl;
            document.getElementById('modalInfo').textContent = `${log.date_key ? log.date_key + ' • ' : ''}${log.time_only || log.timestamp} | ${log.camera_id} | ${log.person_count} Persons`;
            const cropContainer = document.getElementById('cropContainer');
            const bbox = log.bbox_data || [];
            if (bbox.length > 0) {
                cropContainer.style.display = 'flex';
                cropContainer.innerHTML = `<div class="crop-title">Faces (${bbox.length})</div>`;
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    let facesAdded = 0;
                    bbox.forEach(person => {
                        if (!person.face_visible) return;
                        let fx1, fy1, fx2, fy2;
                        if (person.face_box && person.face_box.length === 4) { [fx1, fy1, fx2, fy2] = person.face_box.map(Number); }
                        else { const [x1, y1, x2, y2] = person.bbox.map(Number); const bw = x2-x1, bh = y2-y1; if (bw < 30 || bh < 60) return; const pad = bw*0.10; fx1=Math.max(0,x1+pad); fy1=Math.max(0,y1); fx2=Math.min(img.naturalWidth,x2-pad); fy2=Math.min(img.naturalHeight,y1+bh*0.36); }
                        const fw = fx2-fx1, fh = fy2-fy1;
                        if (fw < 20 || fh < 20) return;
                        const padX=fw*0.15, padY=fh*0.15;
                        const pfx1=Math.max(0,fx1-padX), pfy1=Math.max(0,fy1-padY), pfx2=Math.min(img.naturalWidth,fx2+padX), pfy2=Math.min(img.naturalHeight,fy2+padY);
                        const pfw=pfx2-pfx1, pfh=pfy2-pfy1;
                        const CANVAS_W=130, CANVAS_H=Math.round(CANVAS_W*pfh/pfw);
                        const canvas=document.createElement('canvas'); canvas.width=CANVAS_W; canvas.height=CANVAS_H;
                        const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality='high';
                        ctx.drawImage(img,pfx1,pfy1,pfw,pfh,0,0,CANVAS_W,CANVAS_H);
                        const name=(person.name && person.name!=='Unknown') ? person.name : `#${person.id}`;
                        const div=document.createElement('div'); div.className='crop-item'; div.appendChild(canvas);
                        const lbl=document.createElement('div'); lbl.className='crop-item-label'; lbl.textContent=name; div.appendChild(lbl);
                        cropContainer.appendChild(div); facesAdded++;
                    });
                    if (facesAdded === 0) cropContainer.innerHTML = '<div class="crop-title" style="color:#555;padding:10px 0;">No clear faces</div>';
                    else { const title=cropContainer.querySelector('.crop-title'); if(title) title.textContent=`Faces (${facesAdded})`; }
                };
                img.onerror = () => { cropContainer.innerHTML = '<div class="crop-title" style="color:#555;">Image unavailable</div>'; };
                img.src = imageUrl;
            } else { cropContainer.innerHTML = '<div class="crop-title" style="color:#555;padding:10px;">No data</div>'; }
            document.getElementById('imageModal').classList.add('active');
        }

        function closeModal() { document.getElementById('imageModal').classList.remove('active'); }
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        document.addEventListener('DOMContentLoaded', () => {
            loadCameras().then(() => loadLogs(1));
        });
    </script>
</body>
</html>
