<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vigilance - Registered Detections</title>
    <link rel="stylesheet" href="/static/shared.css">
    <script>(function(){ const theme = localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme', theme); })();</script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; transition: background 0.3s, color 0.3s; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { padding: 20px 32px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); z-index: 10; }
        .toolbar-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
        .content { flex: 1; padding: 32px; overflow-y: auto; background: var(--bg-secondary); }
        .logs-table { width: 100%; background: var(--bg-panel); border-radius: 12px; overflow: hidden; border-collapse: collapse; box-shadow: var(--shadow); }
        .logs-table th { background: var(--accent); color: white; padding: 16px 24px; text-align: left; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
        .logs-table td { padding: 16px 24px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); font-size: 0.95rem; }
        .logs-table tr:last-child td { border-bottom: none; }
        .logs-table tr:hover { background: var(--bg-secondary); }
        .person-info { display: flex; align-items: center; gap: 16px; }
        .person-thumb { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); background: var(--bg-primary); }
        .camera-badge { background: var(--bg-primary); padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; color: var(--text-primary); border: 1px solid var(--border-color); }
        .empty-state { padding: 80px; text-align: center; color: var(--text-secondary); font-size: 1.1rem; }
        .btn-action { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-panel); color: var(--text-primary); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
        .btn-action:hover { background: var(--accent); color: white; border-color: var(--accent); }
        .btn-back-link { text-decoration: none; color: var(--text-secondary); font-size: 0.9rem; display: flex; align-items: center; gap: 8px; transition: color 0.2s; }
        .btn-back-link:hover { color: var(--accent); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="app-container">
        {% include '_sidebar.html' %}

        <div class="main-content">
            <div class="toolbar">
                <div style="display:flex;flex-direction:column;gap:4px;">
                    <a href="/people" class="btn-back-link">← Back to Registry</a>
                    <h1 class="toolbar-title">Identity Logs: <span id="personName" style="color:var(--accent);">All Registered</span></h1>
                </div>
                <div id="live-clock" style="font-family:monospace;color:var(--text-secondary);font-size:0.9rem;"></div>
            </div>
            <div style="padding:16px 32px 0;background:var(--bg-panel);border-bottom:1px solid var(--border-color);display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;">
                <div style="display:flex;flex-direction:column;gap:6px;"><label style="font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;">Date From</label><input type="date" id="date-from" style="padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:0.88rem;outline:none;"></div>
                <div style="display:flex;flex-direction:column;gap:6px;"><label style="font-size:11px;font-weight:700;color:var(--text-secondary);text-transform:uppercase;">Date To</label><input type="date" id="date-to" style="padding:8px 12px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:8px;color:var(--text-primary);font-size:0.88rem;outline:none;"></div>
                <button onclick="loadLogs(1)" style="padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;">Search</button>
                <button onclick="clearFilters()" style="padding:8px 16px;background:var(--bg-secondary);color:var(--text-primary);border:1px solid var(--border-color);border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;">Clear</button>
            </div>
            <div class="content">
                <table class="logs-table">
                    <thead><tr><th>Time</th><th>Person</th><th>Snapshot</th><th>Camera</th><th style="text-align:center;">View</th></tr></thead>
                    <tbody id="logsBody">
                        <tr><td style="padding:16px 24px;"><div class="bone bone-square" style="height:13px;width:65%;"></div></td><td style="padding:16px 24px;"><div style="display:flex;align-items:center;gap:16px;"><div class="bone bone-circle" style="width:48px;height:48px;"></div><div class="bone bone-square" style="height:13px;width:100px;"></div></div></td><td style="padding:16px 24px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:16px 24px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:16px 24px;text-align:center;"><div class="bone bone-btn bone-rounded" style="margin:0 auto;"></div></td></tr>
                        <tr><td style="padding:16px 24px;"><div class="bone bone-square" style="height:13px;width:75%;"></div></td><td style="padding:16px 24px;"><div style="display:flex;align-items:center;gap:16px;"><div class="bone bone-circle" style="width:48px;height:48px;"></div><div class="bone bone-square" style="height:13px;width:120px;"></div></div></td><td style="padding:16px 24px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:16px 24px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:16px 24px;text-align:center;"><div class="bone bone-btn bone-rounded" style="margin:0 auto;"></div></td></tr>
                        <tr><td style="padding:16px 24px;"><div class="bone bone-square" style="height:13px;width:55%;"></div></td><td style="padding:16px 24px;"><div style="display:flex;align-items:center;gap:16px;"><div class="bone bone-circle" style="width:48px;height:48px;"></div><div class="bone bone-square" style="height:13px;width:90px;"></div></div></td><td style="padding:16px 24px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:16px 24px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:16px 24px;text-align:center;"><div class="bone bone-btn bone-rounded" style="margin:0 auto;"></div></td></tr>
                    </tbody>
                </table>
                <div id="pagination" style="display:flex;align-items:center;justify-content:space-between;margin-top:20px;padding:0 4px;"></div>
            </div>
        </div>
    </div>

    <div id="imgModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:10px;" onclick="closeModal()">
        <div style="color:#fff;font-size:0.9rem;font-weight:600;letter-spacing:1px;opacity:0.8;" id="modalLabel"></div>
        <img id="modalImg" src="" style="width:auto;height:auto;max-width:95vw;max-height:88vh;min-width:400px;object-fit:contain;border-radius:10px;border:2px solid var(--accent);box-shadow:0 8px 40px rgba(0,0,0,0.8);">
        <div style="color:#666;font-size:11px;">Click anywhere to close</div>
    </div>

    <script src="/static/skeleton.js"></script>
    <script src="/static/shared.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const personName = urlParams.get('person_name');
        if (personName) document.getElementById('personName').textContent = personName;

        const PAGE_SIZE = 20;
        let currentPage = 1;

        function clearFilters() { document.getElementById('date-from').value = ''; document.getElementById('date-to').value = ''; loadLogs(1); }

        async function loadLogs(page = 1) {
            currentPage = page;
            const tbody = document.getElementById('logsBody');
            const dateFrom = document.getElementById('date-from').value;
            const dateTo   = document.getElementById('date-to').value;
            Boneyard.tableRows('logsBody', 4, 5);
            try {
                let url = `/api/registered_detections?page=${page}&page_size=${PAGE_SIZE}`;
                if (personName) url += `&name=${encodeURIComponent(personName)}`;
                if (dateFrom)   url += `&date_from=${dateFrom}`;
                if (dateTo)     url += `&date_to=${dateTo}`;
                const res = await fetch(url);
                const result = await res.json();
                const logs = result.data || [], total = result.total || 0;
                if (logs.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state">No recorded encounters in the log.</td></tr>'; renderPagination(0); return; }
                tbody.innerHTML = logs.map((l, idx) => {
                    const snapUrl = l.snapshot_path ? `/api/snapshot_image?path=${encodeURIComponent(l.snapshot_path)}` : null;
                    const profileUrl = l.profile_image ? `/api/snapshot_image?path=${encodeURIComponent(l.profile_image)}` : `https://ui-avatars.com/api/?name=${encodeURIComponent(l.person_name)}&background=c41e3a&color=fff`;
                    const thumbSrc = snapUrl || profileUrl;
                    const hasSnap  = !!snapUrl;
                    return `<tr style="animation:fadeIn 0.3s forwards;animation-delay:${idx*0.04}s;opacity:0;"><td><div style="font-size:11px;font-weight:700;color:var(--text-secondary);margin-bottom:3px;">${l.date_key || ''}</div><span style="font-family:monospace;font-weight:600;font-size:0.88rem;">${l.time_only || l.timestamp}</span></td><td><div class="person-info" style="gap:12px;"><img src="${profileUrl}" class="person-thumb" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(l.person_name)}&background=c41e3a&color=fff'" title="Registered profile photo"><div><strong>${l.person_name}</strong><div style="font-size:10px;color:${hasSnap?'var(--accent)':'var(--text-secondary)'};margin-top:2px;">${hasSnap ? '📸 Detection snapshot' : 'No snapshot yet'}</div></div></div></td><td>${hasSnap ? `<div style="cursor:pointer;" onclick="openModal('${thumbSrc}','${l.person_name}')" title="Click to enlarge"><img src="${thumbSrc}" onerror="this.style.display='none'" style="width:120px;height:80px;border-radius:8px;object-fit:cover;border:2px solid var(--accent);"></div>` : `<span style="color:var(--text-secondary);font-size:12px;">—</span>`}</td><td><div class="camera-badge">${l.camera_id}</div><div style="font-size:11px;margin-top:4px;color:var(--text-secondary);">IP: ${l.camera_ip}</div></td><td><div style="display:flex;justify-content:center;"><button class="btn-action" onclick="openModal('${thumbSrc}','${l.person_name}')" title="View Detection Snapshot"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button></div></td></tr>`;
                }).join('');
                renderPagination(total);
            } catch (err) { tbody.innerHTML = '<tr><td colspan="5" class="empty-state" style="color:var(--accent);">Database connectivity error.</td></tr>'; }
        }

        function renderPagination(total) {
            const totalPages = Math.ceil(total / PAGE_SIZE);
            const pg = document.getElementById('pagination');
            if (totalPages <= 1) { pg.innerHTML = ''; return; }
            const start = (currentPage - 1) * PAGE_SIZE + 1;
            const end   = Math.min(currentPage * PAGE_SIZE, total);
            const btn = (i) => `<button onclick="loadLogs(${i})" style="padding:6px 12px;border-radius:6px;border:1px solid ${i===currentPage?'var(--accent)':'var(--border-color)'};background:${i===currentPage?'var(--accent)':'var(--bg-panel)'};color:${i===currentPage?'#fff':'var(--text-primary)'};cursor:pointer;font-size:13px;${i===currentPage?'font-weight:700;':''}">${i}</button>`;
            let pages = '';
            for (let i = 1; i <= totalPages; i++) {
                if (i===1||i===totalPages||(i>=currentPage-2&&i<=currentPage+2)) pages += btn(i);
                else if (i===currentPage-3||i===currentPage+3) pages += `<span style="padding:0 4px;color:var(--text-secondary);">…</span>`;
            }
            pg.innerHTML = `<span style="color:var(--text-secondary);font-size:13px;">Showing ${start}–${end} of ${total}</span><div style="display:flex;gap:6px;align-items:center;"><button onclick="loadLogs(${currentPage-1})" ${currentPage===1?'disabled':''} style="padding:6px 12px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-panel);color:var(--text-primary);cursor:pointer;font-size:13px;">‹ Prev</button>${pages}<button onclick="loadLogs(${currentPage+1})" ${currentPage===totalPages?'disabled':''} style="padding:6px 12px;border-radius:6px;border:1px solid var(--border-color);background:var(--bg-panel);color:var(--text-primary);cursor:pointer;font-size:13px;">Next ›</button></div>`;
        }

        function openModal(url, name) { const m = document.getElementById('imgModal'); document.getElementById('modalImg').src = url; document.getElementById('modalLabel').textContent = name + ' — Detection Snapshot'; m.style.display = 'flex'; }
        function closeModal() { document.getElementById('imgModal').style.display = 'none'; }

        document.addEventListener('DOMContentLoaded', () => { loadLogs(1); });
    </script>
</body>
</html>
