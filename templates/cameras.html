<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vigilance - Camera List</title>
    <link rel="stylesheet" href="/static/shared.css">
    <script>(function(){ const theme = localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme', theme); })();</script>
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { background: var(--bg-panel); padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; transition: background 0.3s; }
        .toolbar-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .content { flex: 1; padding: 20px; overflow-y: auto; background: var(--bg-secondary); transition: background 0.3s; }
        .content-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }
        .panel { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; transition: background 0.3s, border-color 0.3s; }
        .panel-header { background: var(--bg-panel); padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .panel-body { padding: 20px; color: var(--text-primary); }
        .btn { padding: 8px 16px; border: 1px solid var(--border-color); background: var(--bg-panel); color: var(--text-primary); font-size: 13px; cursor: pointer; border-radius: 4px; transition: all 0.2s; }
        .btn:hover { background: var(--bg-secondary); }
        .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger { background: #e74c3c; border-color: #e74c3c; color: #fff; }
        .btn-danger:hover { background: #c0392b; }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .data-table th { background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
        .data-table td { font-size: 13px; color: var(--text-primary); }
        .status-online { color: #27ae60; font-weight: 600; }
        .status-offline { color: #e74c3c; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--bg-panel); padding: 24px; border-radius: 12px; max-width: 90vw; border: 1px solid var(--border-color); box-shadow: 0 20px 40px rgba(0,0,0,0.4); color: var(--text-primary); }
        canvas { border: 2px solid var(--accent); max-width: 100%; cursor: crosshair; border-radius: 4px; }
        .edit-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; }
        .edit-modal-overlay.active { display: flex; }
        .edit-modal { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 28px; width: 420px; max-width: 95vw; box-shadow: 0 20px 40px rgba(0,0,0,0.4); color: var(--text-primary); }
        .edit-modal h3 { margin-bottom: 18px; font-size: 16px; }
        .edit-modal label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; margin-top: 12px; }
        .edit-modal input, .edit-modal select { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); border-radius: 6px; font-size: 13px; }
        .edit-modal input:focus, .edit-modal select:focus { outline: none; border-color: var(--accent); }
        .edit-modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .btn-edit { background: #f39c12; border: none; color: #fff; padding: 5px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; }
        .btn-edit:hover { background: #d68910; }
        .status-msg { margin-top: 10px; font-size: 12px; min-height: 16px; }
        .status-msg.ok { color: #27ae60; }
        .status-msg.err { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="app-container">
        {% include '_sidebar.html' %}

        <div class="main-content">
            <div class="toolbar">
                <h1 class="toolbar-title">Camera List</h1>
                <div id="live-clock" style="font-weight: bold; color: #555;"></div>
            </div>
            <div class="content">
                <div class="content-grid">
                    <div class="panel">
                        <div class="panel-header">Active Cameras</div>
                        <div class="panel-body" style="padding: 0;">
                            <table class="data-table">
                                <thead><tr><th>Camera Name</th><th>Source</th><th>Status</th><th>Action</th></tr></thead>
                                <tbody id="camera-list">
                                    <tr><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:70%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:80%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:12px 15px;"><div style="display:flex;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                                    <tr><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:55%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:75%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:12px 15px;"><div style="display:flex;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                                    <tr><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:65%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:14px;width:60%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:12px 15px;"><div style="display:flex;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/skeleton.js"></script>
    <script src="/static/shared.js"></script>
    <script>
        async function loadCameras() {
            try {
                const res = await fetch('/api/cameras');
                const cameras = await res.json();
                const tbody = document.getElementById('camera-list');
                if (cameras.length === 0) { tbody.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--text-secondary);">No cameras connected</td></tr>'; return; }
                tbody.innerHTML = cameras.map(cam => `<tr><td>${cam.id}</td><td>${cam.source}</td><td><span class="status-online">● Online</span></td><td><button class="btn btn-primary" id="rec-btn-${cam.id}" onclick="toggleRecording('${cam.id}')" style="padding: 5px 12px; font-size: 12px; margin-right: 5px;">Loading...</button><button class="btn" onclick="viewLogs('${cam.id}')" style="padding: 5px 12px; font-size: 12px; margin-right: 5px;">Logs</button><button class="btn-edit" onclick="openEditCamera('${cam.id}', \`${cam.source}\`)">Edit</button><button class="btn btn-danger" onclick="removeCamera('${cam.id}')" style="padding: 5px 12px; font-size: 12px; margin-left: 5px;">Remove</button></td></tr>`).join('');
                cameras.forEach(cam => loadRecordingSetting(cam.id));
            } catch (err) {}
        }

        async function removeCamera(cameraId) { if (!confirm(`Remove camera "${cameraId}"?`)) return; try { const res = await fetch(`/api/remove_camera/${cameraId}`, { method: 'DELETE' }); if (res.ok) loadCameras(); } catch (err) {} }

        async function loadRecordingSetting(cameraId) {
            try {
                const res = await fetch(`/api/camera_settings/${cameraId}`);
                const data = await res.json();
                const btn = document.getElementById(`rec-btn-${cameraId}`);
                if (btn) { const isRecording = data.actually_recording; btn.textContent = isRecording ? 'ON' : 'OFF'; btn.style.background = isRecording ? '#e74c3c' : 'var(--accent)'; }
            } catch (err) {}
        }

        async function toggleRecording(cameraId) {
            try {
                const res = await fetch(`/api/camera_settings/${cameraId}`);
                const data = await res.json();
                const formData = new FormData(); formData.append('enabled', !data.recording_enabled);
                const updateRes = await fetch(`/api/camera_settings/${cameraId}`, { method: 'POST', body: formData });
                if (updateRes.ok) loadRecordingSetting(cameraId);
            } catch (err) {}
        }

        function viewLogs(cameraId) { window.location.href = `/detection_logs?camera_id=${cameraId}`; }

        let _editCamId = null;
        function openEditCamera(camId, currentSource) { _editCamId = camId; document.getElementById('edit-cam-source').value = currentSource; document.getElementById('edit-cam-status').textContent = ''; document.getElementById('edit-cam-modal').classList.add('active'); }
        function closeEditCamera() { document.getElementById('edit-cam-modal').classList.remove('active'); }
        async function saveEditCamera() {
            const source = document.getElementById('edit-cam-source').value.trim();
            const type = document.getElementById('edit-cam-type').value;
            const statusEl = document.getElementById('edit-cam-status');
            if (!source) { statusEl.textContent = 'Source URL is required.'; statusEl.className = 'status-msg err'; return; }
            statusEl.textContent = 'Saving...'; statusEl.className = 'status-msg';
            const fd = new FormData(); fd.append('source', source); fd.append('camera_type', type);
            try {
                const res = await fetch(`/api/edit_camera/${_editCamId}`, { method: 'PUT', body: fd });
                const data = await res.json();
                if (data.status === 'success') { statusEl.textContent = 'Updated successfully!'; statusEl.className = 'status-msg ok'; setTimeout(() => { closeEditCamera(); loadCameras(); }, 800); }
                else { statusEl.textContent = data.message || 'Failed.'; statusEl.className = 'status-msg err'; }
            } catch(e) { statusEl.textContent = 'Error: ' + e.message; statusEl.className = 'status-msg err'; }
        }

        document.addEventListener('DOMContentLoaded', () => { loadCameras(); });
    </script>

    <div class="edit-modal-overlay" id="edit-cam-modal" onclick="if(event.target===this)closeEditCamera()">
        <div class="edit-modal">
            <h3>✏️ Edit Camera Source</h3>
            <label>Camera Type</label>
            <select id="edit-cam-type"><option value="rtsp">RTSP</option><option value="mjpeg">MJPEG / HTTP</option><option value="ipwebcam">IP Webcam</option><option value="droidcam">DroidCam</option><option value="webcam">Webcam (index)</option></select>
            <label>Source URL / Address</label>
            <input type="text" id="edit-cam-source" placeholder="rtsp://... or http://...">
            <div class="status-msg" id="edit-cam-status"></div>
            <div class="edit-modal-actions"><button class="btn" onclick="closeEditCamera()">Cancel</button><button class="btn btn-primary" onclick="saveEditCamera()">Save</button></div>
        </div>
    </div>
</body>
</html>
