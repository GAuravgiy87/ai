<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vigilance - Add Camera</title>
    <link rel="stylesheet" href="/static/shared.css">
    <script>(function(){ const theme = localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme', theme); })();</script>
    <style>
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; display: flex; transition: background 0.3s, color 0.3s; }
        .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .toolbar { padding: 20px 32px; background: var(--bg-panel); border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; box-shadow: var(--shadow); z-index: 10; }
        .toolbar-title { font-size: 1.25rem; font-weight: 700; color: var(--text-primary); }
        .content { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg-secondary); }
        .content-grid { max-width: 500px; margin: 0 auto; }
        .panel { background: var(--bg-panel); border-radius: 16px; border: 1px solid var(--border-color); box-shadow: var(--shadow); overflow: hidden; animation: slideUp 0.4s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .panel-header { background: var(--accent); padding: 24px; color: white; font-weight: 700; font-size: 1.1rem; text-align: center; }
        .panel-body { padding: 32px; }
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); }
        .form-group input, .form-group select { width: 100%; padding: 12px 16px; background: var(--input-bg, var(--bg-panel)); border: 1.5px solid var(--border-color); border-radius: 10px; color: var(--text-primary); font-size: 0.95rem; transition: all 0.2s; outline: none; }
        .form-group input:focus, .form-group select:focus { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(196, 30, 58, 0.1); }
        .btn-submit { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 10px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(196, 30, 58, 0.2); }
        .btn-submit:hover { background: var(--accent-hover); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="app-container">
        {% include '_sidebar.html' %}

        <div class="toast-container" id="toast-container"></div>

        <div class="main-content">
            <div class="toolbar">
                <h1 class="toolbar-title">Register New Surveillance Node</h1>
                <div id="live-clock" style="font-weight: 700; color: var(--text-secondary); font-family: monospace;"></div>
            </div>
            <div class="content">
                <div class="content-grid">
                    <div class="panel">
                        <div class="panel-header">NODE CONFIGURATION</div>
                        <div class="panel-body">
                            <form id="camera-form">
                                <div class="form-group"><label>IDENTIFIER</label><input type="text" name="camera_id" placeholder="e.g. Zone-A Entrance" required></div>
                                <div class="form-group"><label>PROTOCOL TYPE</label><select name="camera_type" id="camera-type"><option value="webcam">Local Media Engine (Webcam)</option><option value="rtsp">Network Stream (RTSP/ONVIF)</option><option value="ipwebcam">IP Sensor Array</option><option value="droidcam">Mobile Link</option></select></div>
                                <div class="form-group"><label>SOURCE / ENDPOINT</label><input type="text" name="source" id="camera-source" placeholder="e.g. 0 or rtsp://..." required></div>
                                <button type="submit" class="btn-submit">INITIALIZE CAMERA</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/shared.js"></script>
    <script>
        document.getElementById('camera-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.disabled = true; btn.textContent = 'Initializing...';
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData);
            try {
                const res = await fetch('/api/add_camera', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
                const result = await res.json();
                if (result.status === 'success') {
                    const successToast = document.createElement('div');
                    successToast.className = 'toast active';
                    successToast.innerHTML = `<div class="toast-content"><span class="toast-title">Node Registered</span><span class="toast-meta">Camera successfully added to grid.</span></div>`;
                    document.getElementById('toast-container').appendChild(successToast);
                    setTimeout(() => successToast.remove(), 3000);
                    e.target.reset();
                } else { alert('Registration Failed: ' + (result.message || 'Unknown Error')); }
            } catch (err) { alert('Connection Error: ' + err.message); }
            finally { btn.disabled = false; btn.textContent = originalText; }
        });
    </script>
</body>
</html>
