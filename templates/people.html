<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Vigilance - Registered Persons</title>
    <link rel="stylesheet" href="/static/shared.css">
    <script>(function(){ const theme = localStorage.getItem('theme')||'light'; document.documentElement.setAttribute('data-theme', theme); })();</script>
    <style>
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: var(--bg-primary); color: var(--text-primary); height: 100vh; overflow: hidden; transition: background 0.3s, color 0.3s; }
        .top-bar { background: var(--bg-panel); padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; transition: background 0.3s; }
        .page-title { font-size: 16px; font-weight: 600; color: var(--text-primary); }
        .content-area { flex: 1; padding: 20px; overflow-y: auto; display: grid; grid-template-columns: 350px 1fr; gap: 20px; background: var(--bg-secondary); transition: background 0.3s; }
        .card { background: var(--bg-panel); border: 1px solid var(--border-color); box-shadow: var(--shadow); border-radius: 8px; overflow: hidden; transition: background 0.3s, border-color 0.3s; }
        .card-header { background: var(--bg-panel); padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 14px; color: var(--text-primary); }
        .card-body { padding: 20px; color: var(--text-primary); }
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; margin-bottom: 6px; font-size: 13px; color: var(--text-secondary); font-weight: 500; }
        .form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); font-size: 13px; }
        .form-input:focus { outline: none; border-color: var(--accent); }
        .btn { padding: 8px 16px; font-size: 13px; cursor: pointer; border: 1px solid var(--border-color); background: var(--bg-panel); color: var(--text-primary); border-radius: 4px; transition: all 0.2s; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-outline { color: var(--text-primary); border-color: var(--border-color); }
        .btn-outline:hover { background: var(--bg-secondary); }
        .btn-danger { background: #e74c3c; color: #fff; border: none; padding: 5px 10px; font-size: 11px; border-radius: 3px; }
        .btn-danger:hover { background: #c0392b; }
        .btn-view { background: #2196f3; color: #fff; border: none; padding: 5px 10px; font-size: 11px; border-radius: 3px; }
        .btn-edit { background: #f39c12; border: none; color: #fff; padding: 5px 10px; font-size: 11px; border-radius: 3px; cursor: pointer; }
        .btn-edit:hover { background: #d68910; }
        .edit-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 2000; justify-content: center; align-items: center; }
        .edit-modal-overlay.active { display: flex; }
        .edit-modal { background: var(--bg-panel); border: 1px solid var(--border-color); border-radius: 12px; padding: 28px; width: 400px; max-width: 95vw; box-shadow: 0 20px 40px rgba(0,0,0,0.4); color: var(--text-primary); }
        .edit-modal h3 { margin-bottom: 18px; font-size: 16px; }
        .edit-modal label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 5px; margin-top: 12px; }
        .edit-modal input { width: 100%; padding: 9px 12px; border: 1px solid var(--border-color); background: var(--bg-primary); color: var(--text-primary); border-radius: 6px; font-size: 13px; }
        .edit-modal input:focus { outline: none; border-color: var(--accent); }
        .edit-modal-actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }
        .status-msg { margin-top: 10px; font-size: 12px; min-height: 16px; }
        .status-msg.ok { color: #27ae60; }
        .status-msg.err { color: #e74c3c; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { background: var(--accent); color: #fff; padding: 12px 15px; font-size: 13px; }
        .data-table td { padding: 12px 15px; border-bottom: 1px solid var(--border-color); font-size: 13px; color: var(--text-primary); }
        .person-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-color); }
        .location-tag { background: rgba(196,30,58,0.1); color: var(--accent); padding: 4px 8px; border-radius: 3px; font-size: 11px; font-weight: 600; }
        .status-toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-100px); padding: 12px 24px; border-radius: 6px; color: #fff; z-index: 10001; transition: transform 0.3s; }
        .status-toast.active { transform: translateX(-50%) translateY(0); }
        .status-toast.success { background: #2ecc71; }
        .status-toast.error { background: #e74c3c; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { max-width: 90vw; max-height: 90vh; }
        .modal-content img { max-width: 100%; max-height: 90vh; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="app-container">
        {% include '_sidebar.html' %}

        <main class="main-content">
            <header class="top-bar">
                <h1 class="page-title">Registered Persons</h1>
            </header>
            <div class="content-area">
                <div class="card">
                    <div class="card-header">Register New Person</div>
                    <div class="card-body">
                        <form id="register-form">
                            <div class="form-group"><label class="form-label">Full Name</label><input type="text" name="name" class="form-input" placeholder="Enter Full Name" required></div>
                            <div class="form-group"><label class="form-label">Reference Photo</label><input type="file" name="file" accept="image/*" class="form-input" required id="file-input"></div>
                            <button type="submit" class="btn btn-primary" id="reg-btn">Register</button>
                        </form>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header">Registered Members List</div>
                    <div class="card-body" style="padding: 0;">
                        <table class="data-table">
                            <thead><tr><th>Member</th><th>Last Seen</th><th>Location</th><th style="text-align: right;">Actions</th></tr></thead>
                            <tbody id="persons-list">
                                <tr><td style="padding:12px 15px;"><div style="display:flex;align-items:center;gap:10px;"><div class="bone bone-circle" style="width:40px;height:40px;"></div><div class="bone bone-square" style="height:13px;width:120px;"></div></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:13px;width:60%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:12px 15px;text-align:right;"><div style="display:flex;justify-content:flex-end;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                                <tr><td style="padding:12px 15px;"><div style="display:flex;align-items:center;gap:10px;"><div class="bone bone-circle" style="width:40px;height:40px;"></div><div class="bone bone-square" style="height:13px;width:100px;"></div></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:13px;width:50%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:12px 15px;text-align:right;"><div style="display:flex;justify-content:flex-end;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                                <tr><td style="padding:12px 15px;"><div style="display:flex;align-items:center;gap:10px;"><div class="bone bone-circle" style="width:40px;height:40px;"></div><div class="bone bone-square" style="height:13px;width:140px;"></div></div></td><td style="padding:12px 15px;"><div class="bone bone-square" style="height:13px;width:70%;"></div></td><td style="padding:12px 15px;"><div class="bone bone-badge bone-rounded"></div></td><td style="padding:12px 15px;text-align:right;"><div style="display:flex;justify-content:flex-end;gap:6px;"><div class="bone bone-btn"></div><div class="bone bone-btn"></div><div class="bone bone-btn"></div></div></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="modal" id="imageModal" onclick="this.classList.remove('active')">
        <div class="modal-content"><img id="modalImg" src="" alt="Snapshot"></div>
    </div>
    <div id="toast" class="status-toast"></div>

    <script src="/static/skeleton.js"></script>
    <script src="/static/shared.js"></script>
    <script>
        const statusToast = document.getElementById('toast');
        function showStatusToast(msg, type = 'success') {
            statusToast.textContent = msg;
            statusToast.className = `status-toast active ${type}`;
            setTimeout(() => statusToast.classList.remove('active'), 3000);
        }

        async function loadPersons() {
            try {
                const res = await fetch('/api/registered_persons');
                const persons = await res.json();
                const container = document.getElementById('persons-list');
                if (persons.length === 0) { container.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:var(--text-secondary);">No members registered yet</td></tr>'; return; }
                container.innerHTML = persons.map(p => {
                    const lastSeen = p.last_seen ? new Date(p.last_seen).toLocaleString() : 'Never';
                    const imageUrl = p.image_path ? `/api/snapshot_image?path=${encodeURIComponent(p.image_path)}` : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(p.name);
                    return `<tr><td><div style="display: flex; align-items: center; gap: 10px;"><img src="${imageUrl}" class="person-avatar" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}'"><strong>${p.name}</strong></div></td><td style="color: var(--text-secondary);">${lastSeen}</td><td><span class="${p.last_camera ? 'location-tag' : ''}">${p.last_camera || '—'}</span></td><td style="text-align: right;"><button class="btn-view" onclick="viewImage('${imageUrl}')">View</button><button class="btn btn-primary" style="background: #4caf50; border: none; padding: 5px 10px; font-size: 11px; width: auto;" onclick="location.href='/registered_detections?person_name=${encodeURIComponent(p.name)}'">Logs</button><button class="btn-edit" onclick="openEditPerson('${p.id}', \`${p.name.replace(/`/g,'\\`')}\`)">Edit</button><button class="btn-danger" onclick="deletePerson('${p.id}')">Delete</button></td></tr>`;
                }).join('');
            } catch (err) {}
        }

        function viewImage(url) { document.getElementById('modalImg').src = url; document.getElementById('imageModal').classList.add('active'); }

        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('reg-btn');
            btn.disabled = true; btn.textContent = 'Processing...';
            const formData = new FormData(e.target);
            try {
                const res = await fetch('/register', { method: 'POST', body: formData });
                if (res.ok) { showStatusToast('Identity registered successfully!'); e.target.reset(); loadPersons(); }
                else showStatusToast('Registration failed', 'error');
            } catch (err) { showStatusToast(err.message, 'error'); }
            btn.disabled = false; btn.textContent = 'Register';
        });

        async function deletePerson(personId) {
            if (!confirm('Delete this person?')) return;
            try { const res = await fetch(`/api/delete_person/${personId}`, { method: 'DELETE' }); if (res.ok) loadPersons(); } catch (err) {}
        }

        let _editPersonId = null;
        function openEditPerson(personId, currentName) { _editPersonId = personId; document.getElementById('edit-person-name').value = currentName; document.getElementById('edit-person-file').value = ''; document.getElementById('edit-person-status').textContent = ''; document.getElementById('edit-person-modal').classList.add('active'); }
        function closeEditPerson() { document.getElementById('edit-person-modal').classList.remove('active'); }
        async function saveEditPerson() {
            const name = document.getElementById('edit-person-name').value.trim();
            const file = document.getElementById('edit-person-file').files[0];
            const statusEl = document.getElementById('edit-person-status');
            if (!name) { statusEl.textContent = 'Name is required.'; statusEl.className = 'status-msg err'; return; }
            statusEl.textContent = 'Saving...'; statusEl.className = 'status-msg';
            const fd = new FormData(); fd.append('name', name); if (file) fd.append('file', file);
            try {
                const res = await fetch(`/api/edit_person/${_editPersonId}`, { method: 'PUT', body: fd });
                const data = await res.json();
                if (data.status === 'success') { statusEl.textContent = 'Updated!'; statusEl.className = 'status-msg ok'; setTimeout(() => { closeEditPerson(); loadPersons(); }, 700); }
                else { statusEl.textContent = data.message || 'Failed.'; statusEl.className = 'status-msg err'; }
            } catch(e) { statusEl.textContent = 'Error: ' + e.message; statusEl.className = 'status-msg err'; }
        }

        document.addEventListener('DOMContentLoaded', () => { loadPersons(); });
    </script>

    <div class="edit-modal-overlay" id="edit-person-modal" onclick="if(event.target===this)closeEditPerson()">
        <div class="edit-modal">
            <h3>✏️ Edit Person</h3>
            <label>Full Name</label><input type="text" id="edit-person-name" placeholder="Full Name">
            <label>New Photo (optional)</label><input type="file" id="edit-person-file" accept="image/*">
            <div class="status-msg" id="edit-person-status"></div>
            <div class="edit-modal-actions"><button class="btn" onclick="closeEditPerson()">Cancel</button><button class="btn btn-primary" onclick="saveEditPerson()">Save</button></div>
        </div>
    </div>
</body>
</html>
