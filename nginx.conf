events {
    worker_connections 1024;
}

http {
    upstream main_app {
        server main_app:9000;
    }

    upstream camera_server {
        server camera_server:9001;
    }

    server {
        listen 80;

        # All API requests to /api/cameras go to camera_server directly
        location /api/cameras {
            proxy_pass http://camera_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # MJPEG video feeds go to the main app which now subscribes to Redis
        # (Alternatively, could go to a dedicated streaming service)
        location /video_feed {
            proxy_pass http://main_app;
            # Disable buffering for MJPEG streaming
            proxy_buffering off;
            proxy_set_header Connection close;
        }

        # SSE Event Stream
        location /api/stream {
            proxy_pass http://main_app;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        # All other UI traffic goes to main_app
        location / {
            proxy_pass http://main_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
