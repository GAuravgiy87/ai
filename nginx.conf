events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ──────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_types         text/plain text/css application/json application/javascript;
    gzip_min_length    1000;

    # ── Upstream definitions ─────────────────────────────────────────────────
    upstream main_app {
        server main_app:9000;
        keepalive 32;
    }

    upstream camera_server {
        server camera_server:9001;
        keepalive 16;
    }

    # ── Shared proxy headers (reused via map / include trick) ────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";

    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout     60s;

    # ── Main server block ────────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Content-Type-Options  "nosniff"       always;
        add_header X-Frame-Options         "SAMEORIGIN"    always;
        add_header X-XSS-Protection        "1; mode=block" always;

        # ── MJPEG live video stream → camera_server ──────────────────────────
        # Disable ALL buffering — required for continuous MJPEG boundary stream.
        # Routed directly to camera_server to avoid double-hop through main_app.
        location ~ ^/video_feed/ {
            proxy_pass         http://camera_server;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;   # keep stream alive indefinitely
        }

        # ── Single frame capture → camera_server ────────────────────────────
        location ~ ^/capture/ {
            proxy_pass http://camera_server;
        }

        # ── Camera server REST API routes ────────────────────────────────────
        # These are the actual routes defined in camera_server/server.py:
        #   GET/POST   /cameras
        #   DELETE     /cameras/{id}
        #   GET        /cameras/{id}         (handled by same prefix)
        #   GET        /health
        #   GET        /results/{id}
        #   GET        /occupancy
        #   GET        /daily_stats
        #   GET/POST   /settings/{id}
        #   GET        /recordings/{id}
        #   POST       /reload_faces
        #   POST       /get_encoding
        location = /cameras {
            proxy_pass http://camera_server;
        }
        location ~ ^/cameras/ {
            proxy_pass         http://camera_server;
            proxy_read_timeout 90s;     # RTSP probe on add can take time
        }
        location = /health {
            proxy_pass http://camera_server;
        }
        location ~ ^/results/ {
            proxy_pass http://camera_server;
        }
        location = /occupancy {
            proxy_pass http://camera_server;
        }
        location = /daily_stats {
            proxy_pass http://camera_server;
        }
        location ~ ^/settings/ {
            proxy_pass http://camera_server;
        }
        location = /reload_faces {
            proxy_pass http://camera_server;
        }
        location = /get_encoding {
            proxy_pass         http://camera_server;
            client_max_body_size 10m;   # face image upload
        }

        # ── SSE notification stream → main_app ───────────────────────────────
        # Server-Sent Events: disable buffering, no timeout (long-lived).
        location = /api/notifications/stream {
            proxy_pass         http://main_app;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_set_header   Cache-Control "no-cache";
        }

        # ── Static file directories served by main_app ───────────────────────
        # These are mounted volumes — let main_app handle them via FastAPI
        # StaticFiles mount (avoids nginx needing volume access).
        location ~ ^/(snapshots|dataset|recordings|static)/ {
            proxy_pass http://main_app;
        }

        # ── All other UI and API traffic → main_app ──────────────────────────
        location / {
            proxy_pass http://main_app;
        }
    }
}
